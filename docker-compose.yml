services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: api-gateway

    env_file:
      - .env

    ports:
      - "5062:5062"

    environment:
      NODE_ENV: development
      # NODE_ENV=production
      PORT: 5062

    restart: unless-stopped

    networks:
      - acb-net
    
networks:
  acb-net:
    external: true
    name: acb-net