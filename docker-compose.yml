services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: api-gateway

    env_file:
      - ${ACB_GATEWAY_ENV_FILE:-.env}

    ports:
      - "127.0.0.1:5062:5062"

    environment:
      NODE_ENV: development
      PORT: 5062
      PATHS_SERVICE_URL: https://geoloca-api:8000
      ACB_TLS_CERT_FILE: /run/acb-tls/gateway.crt
      ACB_TLS_KEY_FILE: /run/acb-tls/gateway.key
      NODE_EXTRA_CA_CERTS: /run/acb-tls/ca.crt

    volumes:
      - type: bind
        source: ${ACB_TLS_DIR:?Set external ACB_TLS_DIR}/gateway.crt
        target: /run/acb-tls/gateway.crt
        read_only: true
      - type: bind
        source: ${ACB_TLS_DIR:?Set external ACB_TLS_DIR}/gateway.key
        target: /run/acb-tls/gateway.key
        read_only: true
      - type: bind
        source: ${ACB_TLS_DIR:?Set external ACB_TLS_DIR}/ca.crt
        target: /run/acb-tls/ca.crt
        read_only: true

    restart: unless-stopped

    # Permite alcanzar los servicios de adminACB publicados en el host
    # tambien cuando Docker corre en Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - acb-net
    
networks:
  acb-net:
    external: true
    name: acb-net
